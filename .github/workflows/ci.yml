# CI for tar-bend. Everything runs through tools/ci.sh, which pins Bend 2.0.39 (sha256-checked)
# and runs tools/test_release.sh. Local equivalent:  ./tools/ci.sh --quick   (or --full)
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"   # weekly full gate against the current runner image
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # Linux x86-64 only (openat2 needs kernel >= 5.6; ubuntu-24.04 ships GNU tar 1.35).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libarchive-tools gzip file python3 curl

      - name: Install Lean (the proof gate's `--verdict` needs v4.34.0)
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache pinned Bend toolchain
        uses: actions/cache@v4
        with:
          path: .cache/toolchain
          # the key is the pinned sha256 of bend-2.0.39-linux-x64.tar.gz (tools/ci.sh)
          key: bend-2.0.39-6cf462fd8f70b094a4950ebb709a9c4ffd8f1d1189d9cedf1fd63cd5d041c7ab

      - name: Release gate (quick on pull requests, full otherwise)
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            ./tools/ci.sh --quick
          else
            ./tools/ci.sh --full
          fi

      - name: Package (unsigned) and verify the packaged binary equals the gated one
        if: github.event_name != 'pull_request'
        run: |
          ./tools/package.sh
          test "$(sha256sum build/btar | cut -d' ' -f1)" = "$(sha256sum dist/btar | cut -d' ' -f1)"
          cat dist/SHA256SUMS

      - name: Upload artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: btar-linux-x64
          path: |
            dist/btar
            dist/btar-*-linux-x64.tar.gz
            dist/tar-bend-*-src.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
